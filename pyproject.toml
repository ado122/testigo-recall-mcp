[project]
name = "testigo-recall-mcp"
version = "0.5.7"
description = "MCP server for querying testigo-recall knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    # mcp 2.0.0 removed the mcp.server.fastmcp module this server imports.
    # Pin below 2.0 until the code is migrated to the 2.0 API.
    "mcp>=1.0,<2.0",
]

[project.scripts]
testigo-recall-mcp = "testigo_recall_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
